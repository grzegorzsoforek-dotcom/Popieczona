function genId(prefix) { return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`; }
function parseAmount(str) {
  if (typeof str === "number") return str;
  const n = parseFloat(String(str).replace(",", ".").trim());
  return isNaN(n) ? 0 : n;
}
function formatNum(n) {
  if (n === null || n === undefined || isNaN(n)) return "0";
  const r = Math.round(n * 100) / 100;
  if (Number.isInteger(r)) return String(r);
  return String(r).replace(/0+$/, "").replace(/\.$/, "");
}

function parseImportText(raw) {
  const lines = raw.split("\n").map((l) => l.trim()).filter(Boolean);
  const ingLineRe = /^([\d]+[\d.,\/]*)\s*(g|kg|ml|l|dag|szt\.?|sztuk[iaę]?|łyżeczk\w*|łyżk\w*|szklan\w*|szczypt\w*|opakowani\w*)?\.?\s+(.+)$/i;
  const ingHeaderRe = /^(składniki)[:.]?$/i;
  const stepHeaderRe = /^(sposób przygotowania|wykonanie|instrukcje|przygotowanie|kroki)[:.]?$/i;
  let mode = "ingredients", foundStepsHeader = false;
  const ingredients = [], steps = [];
  for (const line of lines) {
    if (ingHeaderRe.test(line)) { mode = "ingredients"; continue; }
    if (stepHeaderRe.test(line)) { mode = "steps"; foundStepsHeader = true; continue; }
    if (mode === "ingredients") {
      const m = line.match(ingLineRe);
      if (m) {
        ingredients.push({ id: genId("ing"), amount: parseAmount(m[1]), unit: (m[2] || "g").toLowerCase().replace(/\.$/, ""), name: m[3].trim() });
        continue;
      }
      if (!foundStepsHeader && line.length > 45) { mode = "steps"; steps.push(line); continue; }
      ingredients.push({ id: genId("ing"), amount: 0, unit: "", name: line });
    } else {
      steps.push(line);
    }
  }
  return { ingredients, steps };
}

function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const result = reader.result;
        const match = result.match(/^data:(.*);base64,(.*)$/s);
        if (!match) throw new Error("bad data url");
        resolve({ mediaType: match[1], data: match[2] });
      } catch (e) { reject(e); }
    };
    reader.onerror = () => reject(new Error("read failed"));
    reader.readAsDataURL(file);
  });
}

async function extractRecipeFromImage(base64Data, mediaType, apiKey) {
  const response = await fetch("https://api.anthropic.com/v1/messages", {
    method: "POST",
    headers: {
      "content-type": "application/json",
      "x-api-key": apiKey,
      "anthropic-version": "2023-06-01",
      "anthropic-dangerous-direct-browser-access": "true",
    },
    body: JSON.stringify({
      model: "claude-sonnet-4-6",
      max_tokens: 1500,
      system:
        "Jesteś asystentem odczytującym przepisy kulinarne ze zdjęć (kartka odręczna, wydruk, zrzut ekranu strony). " +
        "Odpowiadaj WYŁĄCZNIE poprawnym obiektem JSON, bez znaczników markdown, bez ```json, bez żadnego innego tekstu przed ani po. " +
        'Format: {"name":string,"category":one of ["Torty","Ciasta","Kremy i nadzienia","Ciastka","Inne"],' +
        '"diet":one of ["klasyczne","bezglutenowe","wegańskie"],"baseServings":number,' +
        '"ingredients":[{"amount":number,"unit":string,"name":string}],"steps":[string],"notes":string}. ' +
        'Jednostki zapisuj krótko po polsku (g, kg, ml, l, szt, łyżeczka, łyżka, szklanka, szczypta, opakowanie). ' +
        "Jeśli któregoś pola nie da się jednoznacznie odczytać, użyj rozsądnej wartości domyślnej (baseServings: 8, category: \"Inne\", diet: \"klasyczne\", notes: \"\"). " +
        "Zachowaj oryginalną treść i język tekstu ze zdjęcia, nie tłumacz.",
      messages: [{
        role: "user",
        content: [
          { type: "image", source: { type: "base64", media_type: mediaType, data: base64Data } },
          { type: "text", text: "Odczytaj ten przepis ze zdjęcia i zwróć dane w formacie JSON opisanym w instrukcji." },
        ],
      }],
    }),
  });
  if (!response.ok) {
    const body = await response.json().catch(() => ({}));
    const msg = body && body.error && body.error.message ? body.error.message : `Błąd API (${response.status})`;
    throw new Error(msg);
  }
  const data = await response.json();
  const textBlock = (data.content || []).find((b) => b.type === "text");
  if (!textBlock || !textBlock.text) throw new Error("Brak odpowiedzi tekstowej");
  const cleaned = textBlock.text.replace(/```json|```/g, "").trim();
  const parsed = JSON.parse(cleaned);
  if (!parsed || typeof parsed !== "object") throw new Error("Nieprawidłowy format odpowiedzi");
  return parsed;
}

function cakeVolumeCm3({ shape, diameter, sideA, sideB, height }) {
  const h = parseFloat(height) || 0;
  if (shape === "round") {
    const r = (parseFloat(diameter) || 0) / 2;
    return Math.PI * r * r * h;
  }
  return (parseFloat(sideA) || 0) * (parseFloat(sideB) || 0) * h;
}

function ScaleDial({ value, min, max, onChange, unitLabel }) {
  const pct = Math.max(0, Math.min(1, (value - min) / (max - min || 1)));
  const angle = -125 + pct * 250;
  const ticks = Array.from({ length: 21 }, (_, i) => i);
  return (
    <div className="flex flex-col items-center py-2">
      <div className="relative" style={{ width: 176, height: 176 }}>
        <svg width="176" height="176" viewBox="0 0 176 176" className="absolute inset-0">
          {ticks.map((i) => {
            const a = (-125 + (i / 20) * 250) * (Math.PI / 180);
            const isMajor = i % 5 === 0;
            const r1 = 78, r2 = isMajor ? 68 : 72, cx = 88, cy = 88;
            const x1 = cx + r1 * Math.sin(a), y1 = cy - r1 * Math.cos(a);
            const x2 = cx + r2 * Math.sin(a), y2 = cy - r2 * Math.cos(a);
            return <line key={i} x1={x1} y1={y1} x2={x2} y2={y2} stroke={isMajor ? T.vanilla : T.textFaint} strokeWidth={isMajor ? 2 : 1} opacity={isMajor ? 0.9 : 0.4} />;

            <line x1="88" y1="88" x2="88" y2="42" stroke={T.raspberry} strokeWidth="3" strokeLinecap="round" />

/* ---------------------------------------------------------------
   LOCAL STORAGE HOOK (persists on this device/browser)
----------------------------------------------------------------*/
function useStoredList(key, seed) {
  const [items, setItems] = useState(() => {
    try {
      const raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : seed;
    } catch { return seed; }
  });
  const persist = useCallback((next) => {
    setItems(next);
    try { localStorage.setItem(key, JSON.stringify(next)); } catch {}
  }, [key]);
  useEffect(() => {
    try { if (!localStorage.getItem(key)) localStorage.setItem(key, JSON.stringify(seed)); } catch {}
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);
  return [items, persist];
}
function useApiKey() {
  const [apiKey, setApiKeyState] = useState(() => { try { return localStorage.getItem(API_KEY_STORAGE) || ""; } catch { return ""; } });
  const setApiKey = useCallback((val) => {
    setApiKeyState(val);
    try { val ? localStorage.setItem(API_KEY_STORAGE, val) : localStorage.removeItem(API_KEY_STORAGE); } catch {}
  }, []);
  return [apiKey, setApiKey];
}

      <TopBar title={recipe.name} onBack={onBack} right={
        <button onClick={() => onDelete(recipe.id)} className="p-1 rounded-full active:opacity-60" style={{ color: T.textFaint }}><Trash2 size={18} /></button>
      } />
      <Screen>
        <div className="flex items-center gap-2 mb-5 flex-wrap">
          <Pill active color={T.vanilla}>{recipe.category}</Pill>
          <Pill active color={T.pistachio}>{recipe.diet}</Pill>
        </div>
        <div className="rounded-2xl p-5 mb-6" style={{ backgroundColor: T.bgElevated, border: `1px solid ${T.border}` }}>
          <p className="text-center text-xs uppercase tracking-widest mb-1" style={{ color: T.textFaint, fontFamily: FONT_BODY }}>Przelicz porcje</p>
          <ScaleDial value={servings} min={1} max={Math.max(48, recipe.baseServings * 3)} onChange={setServings} unitLabel="porcji" />
        </div>
        <p className="text-xs uppercase tracking-widest mb-2" style={{ color: T.textFaint, fontFamily: FONT_BODY }}>Składniki</p>
        <div className="rounded-2xl mb-6 overflow-hidden" style={{ backgroundColor: T.bgElevated, border: `1px solid ${T.border}` }}>
          {recipe.ingredients.map((ing, i) => (
            <div key={ing.id} className="flex items-center justify-between px-4 py-3" style={{ borderTop: i === 0 ? "none" : `1px solid ${T.border}` }}>
              <span style={{ color: T.text, fontFamily: FONT_BODY, fontSize: 15 }}>{ing.name}</span>
              <span style={{ color: T.vanilla, fontFamily: FONT_MONO, fontSize: 15, fontWeight: 600 }}>{formatNum(ing.amount * ratio)} {ing.unit}</span>
            </div>
          ))}
          {recipe.ingredients.length === 0 && <p className="px-4 py-4 text-sm" style={{ color: T.textFaint }}>Brak dodanych składników.</p>}
        </div>
        {recipe.steps.length > 0 && (
          <>
            <p className="text-xs uppercase tracking-widest mb-2" style={{ color: T.textFaint, fontFamily: FONT_BODY }}>Sposób przygotowania</p>
            <div className="space-y-3 mb-6">
              {recipe.steps.map((step, i) => (
                <div key={i} className="flex gap-3">
                  <span className="shrink-0 w-6 h-6 rounded-full flex items-center justify-center text-xs" style={{ backgroundColor: T.bgElevated2, color: T.vanilla, fontFamily: FONT_MONO, fontWeight: 600 }}>{i + 1}</span>
                  <p className="text-sm leading-relaxed pt-0.5" style={{ color: T.textMuted, fontFamily: FONT_BODY }}>{step}</p>
                </div>
              ))}
            </div>
          </>
        )}
        {recipe.notes && (
          <div className="rounded-xl p-4" style={{ backgroundColor: "rgba(227,169,63,0.08)", border: `1px solid rgba(227,169,63,0.25)` }}>
            <p className="text-sm leading-relaxed" style={{ color: T.vanilla, fontFamily: FONT_BODY }}>{recipe.notes}</p>
          </div>
        )}
      </Screen>
    </div>
  );
}

/* ---------------------------------------------------------------
   ADD / IMPORT / PHOTO RECIPE
----------------------------------------------------------------*/
function AddRecipe({ onBack, onSave, apiKey, goToSettings }) {
  const [mode, setMode] = useState("manual");
  const [name, setName] = useState("");
  const [category, setCategory] = useState(CATEGORIES[0]);
  const [diet, setDiet] = useState(DIET_TAGS[0]);
  const [baseServings, setBaseServings] = useState("8");
  const [notes, setNotes] = useState("");
  const [ingredients, setIngredients] = useState([{ id: genId("ing"), amount: "", unit: "g", name: "" }]);
  const [steps, setSteps] = useState([""]);
  const [importText, setImportText] = useState("");
  const [importNotice, setImportNotice] = useState("");
  const [photoPreview, setPhotoPreview] = useState(null);
  const [photoLoading, setPhotoLoading] = useState(false);
  const [photoError, setPhotoError] = useState("");

  const updateIng = (id, patch) => setIngredients((prev) => prev.map((i) => (i.id === id ? { ...i, ...patch } : i)));
  const removeIng = (id) => setIngredients((prev) => prev.filter((i) => i.id !== id));
  const addIng = () => setIngredients((prev) => [...prev, { id: genId("ing"), amount: "", unit: "g", name: "" }]);
  const updateStep = (i, val) => setSteps((prev) => prev.map((s, idx) => (idx === i ? val : s)));
  const removeStep = (i) => setSteps((prev) => prev.filter((_, idx) => idx !== i));
  const addStep = () => setSteps((prev) => [...prev, ""]);

  const runImport = () => {
    if (!importText.trim()) return;
    const { ingredients: parsedIng, steps: parsedSteps } = parseImportText(importText);
    setIngredients(parsedIng.length ? parsedIng.map((i) => ({ ...i, amount: String(i.amount) })) : ingredients);
    setSteps(parsedSteps.length ? parsedSteps : [""]);
    setImportNotice(parsedIng.length ? `Rozpoznano ${parsedIng.length} składników i ${parsedSteps.length} kroków. Sprawdź i popraw przed zapisem.` : "Nie udało się rozpoznać składników automatycznie — dodaj je ręcznie poniżej.");
    setMode("manual");
  };

  const handlePhotoSelect = async (file) => {
    if (!file) return;
    setPhotoError(""); setPhotoLoading(true);
    try {
      const { mediaType, data } = await fileToBase64(file);
      setPhotoPreview(`data:${mediaType};base64,${data}`);
      const extracted = await extractRecipeFromImage(data, mediaType, apiKey);
      setName(extracted.name || "");
      setCategory(CATEGORIES.includes(extracted.category) ? extracted.category : CATEGORIES[0]);
      setDiet(DIET_TAGS.includes(extracted.diet) ? extracted.diet : DIET_TAGS[0]);
      setBaseServings(String(extracted.baseServings || 8));
      setNotes(extracted.notes || "");
      setIngredients(Array.isArray(extracted.ingredients) && extracted.ingredients.length
        ? extracted.ingredients.map((i) => ({ id: genId("ing"), amount: i.amount === undefined || i.amount === null ? "" : String(i.amount), unit: i.unit || "g", name: i.name || "" }))
        : ingredients);
      setSteps(Array.isArray(extracted.steps) && extracted.steps.length ? extracted.steps : [""]);
      setImportNotice("Rozpoznano przepis ze zdjęcia. Sprawdź uważnie ilości i nazwy — odczyt może się mylić, zwłaszcza przy piśmie odręcznym.");
      setMode("manual");
    } catch (e) {
      setPhotoError(e && e.message ? `Nie udało się odczytać zdjęcia: ${e.message}` : "Nie udało się odczytać zdjęcia. Spróbuj wyraźniejszego ujęcia albo dodaj przepis ręcznie.");
    } finally {
      setPhotoLoading(false);
    }
  };

  const canSave = name.trim().length > 0 && ingredients.some((i) => i.name.trim());
  const handleSave = () => {
    onSave({
      id: genId("r"), name: name.trim(), category, diet, baseServings: parseAmount(baseServings) || 1, notes: notes.trim(),
      ingredients: ingredients.filter((i) => i.name.trim()).map((i) => ({ id: i.id, name: i.name.trim(), amount: parseAmount(i.amount), unit: i.unit || "" })),
      steps: steps.map((s) => s.trim()).filter(Boolean),
    });
  };

  return (
    <div className="flex flex-col h-full">
      <TopBar title="Nowy przepis" onBack={onBack} />
      <Screen>
        <div className="flex gap-2 mb-5 flex-wrap">
          <Pill active={mode === "manual"} onClick={() => setMode("manual")}>Wpisz ręcznie</Pill>
          <Pill active={mode === "import"} onClick={() => setMode("import")} color={T.pistachio}>Wklej przepis</Pill>
          <Pill active={mode === "photo"} onClick={() => setMode("photo")} color={T.vanilla}>Zrób zdjęcie</Pill>
        </div>

        {mode === "photo" ? (
          !apiKey ? (
            <div className="rounded-2xl p-5 text-center" style={{ backgroundColor: T.bgElevated, border: `1px solid ${T.border}` }}>
              <AlertCircle size={22} style={{ color: T.vanilla, margin: "0 auto 10px" }} />
              <p className="text-sm mb-4 leading-relaxed" style={{ color: T.textMuted, fontFamily: FONT_BODY }}>
                Rozpoznawanie zdjęć wymaga własnego klucza API Anthropic. Dodaj go w Ustawieniach, żeby korzystać z tej funkcji.
              </p>
              <PrimaryButton onClick={goToSettings} icon={Settings} full={false}>Przejdź do ustawień</PrimaryButton>
            </div>
          ) : (
            <div>
              <p className="text-xs mb-4 leading-relaxed" style={{ color: T.textFaint, fontFamily: FONT_BODY }}>
                Zrób zdjęcie karteczki, wydruku albo zrzutu ekranu z przepisem — rozpoznamy nazwę, składniki i kroki. Zawsze sprawdź wynik przed zapisem, zwłaszcza przy piśmie odręcznym.
              </p>
              <label className="flex flex-col items-center justify-center gap-2 rounded-2xl py-10 px-4 cursor-pointer" style={{ backgroundColor: T.bgElevated, border: `1.5px dashed ${T.borderStrong}` }}>
                <input type="file" accept="image/*" capture="environment" className="hidden" onChange={(e) => handlePhotoSelect(e.target.files && e.target.files[0])} />
                {photoLoading ? (
                  <><Loader2 size={26} style={{ color: T.vanilla }} /><span className="text-sm mt-1" style={{ color: T.textMuted, fontFamily: FONT_BODY }}>Odczytuję przepis…</span></>
                ) : (
                  <><Camera size={26} style={{ color: T.vanilla }} /><span className="text-sm mt-1" style={{ color: T.textMuted, fontFamily: FONT_BODY, fontWeight: 600 }}>Zrób zdjęcie lub wybierz z galerii</span></>
                )}
              </label>
              {photoPreview && !photoLoading && <img src={photoPreview} alt="Podgląd" className="w-full mt-4 rounded-2xl object-cover" style={{ maxHeight: 220, border: `1px solid ${T.border}` }} />}
              {photoError && (
                <div className="rounded-xl p-3 mt-4 flex gap-2 items-start" style={{ backgroundColor: "rgba(193,68,60,0.12)", border: `1px solid rgba(193,68,60,0.35)` }}>
                  <AlertCircle size={16} style={{ color: T.raspberry, marginTop: 2, flexShrink: 0 }} />
                  <p className="text-xs leading-relaxed" style={{ color: T.text, fontFamily: FONT_BODY }}>{photoError}</p>
                </div>
              )}
            </div>
          )
        ) : mode === "import" ? (
          <div>
            <TextArea label="Wklej tekst przepisu" value={importText} onChange={setImportText}
              placeholder={"Składniki:\n200 g mąki\n3 szt jajka\n\nSposób przygotowania:\nWymieszaj składniki...\nPiecz 40 minut."} rows={10} />
            <p className="text-xs mb-4" style={{ color: T.textFaint, fontFamily: FONT_BODY }}>Zadziała najlepiej z nagłówkami „Składniki” i „Sposób przygotowania”. Wynik zawsze można poprawić ręcznie.</p>
            <PrimaryButton onClick={runImport} icon={UploadCloud}>Rozpoznaj przepis</PrimaryButton>
          </div>
        ) : (
          <>
            {importNotice && (
              <div className="rounded-xl p-3 mb-4 flex gap-2 items-start" style={{ backgroundColor: "rgba(227,169,63,0.08)", border: `1px solid rgba(227,169,63,0.25)` }}>
                <AlertCircle size={16} style={{ color: T.vanilla, marginTop: 2, flexShrink: 0 }} />
                <p className="text-xs leading-relaxed" style={{ color: T.vanilla, fontFamily: FONT_BODY }}>{importNotice}</p>
              </div>
            )}
            <TextField label="Nazwa przepisu" value={name} onChange={setName} placeholder="np. Tort czekoladowy z malinami" />
            <span className="block text-xs mb-1.5 tracking-wide uppercase" style={{ color: T.textFaint, fontFamily: FONT_BODY }}>Kategoria</span>
            <div className="flex gap-2 mb-4 flex-wrap">{CATEGORIES.map((c) => <Pill key={c} active={category === c} onClick={() => setCategory(c)}>{c}</Pill>)}</div>
            <span className="block text-xs mb-1.5 tracking-wide uppercase" style={{ color: T.textFaint, fontFamily: FONT_BODY }}>Dieta</span>
            <div className="flex gap-2 mb-4 flex-wrap">{DIET_TAGS.map((d) => <Pill key={d} active={diet === d} onClick={() => setDiet(d)} color={T.pistachio}>{d}</Pill>)}</div>
            <TextField label="Przepis dla ilu porcji" value={baseServings} onChange={setBaseServings} type="number" suffix="porcji" />
            <span className="block text-xs mb-1.5 tracking-wide uppercase" style={{ color: T.textFaint, fontFamily: FONT_BODY }}>Składniki</span>
            <div className="space-y-2 mb-3">
              {ingredients.map((ing) => (
                <div key={ing.id} className="flex gap-2">
                  <input value={ing.amount} onChange={(e) => updateIng(ing.id, { amount: e.target.value })} placeholder="ilość" inputMode="decimal"
                    className="w-16 rounded-lg px-2 py-2.5 outline-none text-center" style={{ backgroundColor: T.bgElevated, border: `1px solid ${T.border}`, color: T.text, fontFamily: FONT_MONO, fontSize: 14 }} />
                  <select value={ing.unit} onChange={(e) => updateIng(ing.id, { unit: e.target.value })} className="w-24 rounded-lg px-1 py-2.5 outline-none"
                    style={{ backgroundColor: T.bgElevated, border: `1px solid ${T.border}`, color: T.textMuted, fontFamily: FONT_BODY, fontSize: 13 }}>
                    {UNITS.map((u) => <option key={u} value={u}>{u}</option>)}
                  </select>
                  <input value={ing.name} onChange={(e) => updateIng(ing.id, { name: e.target.value })} placeholder="nazwa składnika"
                    className="flex-1 min-w-0 rounded-lg px-3 py-2.5 outline-none" style={{ backgroundColor: T.bgElevated, border: `1px solid ${T.border}`, color: T.text, fontFamily: FONT_BODY, fontSize: 14 }} />
                  <button onClick={() => removeIng(ing.id)} className="w-9 shrink-0 rounded-lg flex items-center justify-center" style={{ color: T.textFaint }}><X size={16} /></button>
                </div>
              ))}
            </div>
            <button onClick={addIng} className="flex items-center gap-1.5 text-sm mb-6" style={{ color: T.vanilla, fontFamily: FONT_BODY, fontWeight: 600 }}><Plus size={15} /> Dodaj składnik</button>
            <span className="block text-xs mb-1.5 tracking-wide uppercase" style={{ color: T.textFaint, fontFamily: FONT_BODY }}>Sposób przygotowania</span>
            <div className="space-y-2 mb-3">
              {steps.map((s, i) => (
                <div key={i} className="flex gap-2 items-start">
                  <span className="w-6 h-9 flex items-center justify-center text-xs shrink-0" style={{ color: T.textFaint, fontFamily: FONT_MONO }}>{i + 1}</span>
                  <textarea value={s} onChange={(e) => updateStep(i, e.target.value)} placeholder="Opisz krok..." rows={2}
                    className="flex-1 rounded-lg px-3 py-2 outline-none resize-none" style={{ backgroundColor: T.bgElevated, border: `1px solid ${T.border}`, color: T.text, fontFamily: FONT_BODY, fontSize: 14 }} />
                  <button onClick={() => removeStep(i)} className="w-9 h-9 shrink-0 rounded-lg flex items-center justify-center" style={{ color: T.textFaint }}><X size={16} /></button>
                </div>
              ))}
            </div>
            <button onClick={addStep} className="flex items-center gap-1.5 text-sm mb-6" style={{ color: T.vanilla, fontFamily: FONT_BODY, fontWeight: 600 }}><Plus size={15} /> Dodaj krok</button>
            <TextArea label="Notatki (opcjonalnie)" value={notes} onChange={setNotes} placeholder="Wskazówki, warianty, przechowywanie..." rows={3} />
            <PrimaryButton onClick={handleSave} disabled={!canSave} icon={Save}>Zapisz przepis</PrimaryButton>
          </>
        )}
      </Screen>
    </div>
  );
}

/* ---------------------------------------------------------------
   CALCULATOR
----------------------------------------------------------------*/
function CalculatorScreen() {
  const [tab, setTab] = useState("cake");
  const [shape, setShape] = useState("round");
  const [diameter, setDiameter] = useState("24");
  const [sideA, setSideA] = useState("30");
  const [sideB, setSideB] = useState("20");
  const [height, setHeight] = useState("8");
  const [portionKey, setPortionKey] = useState("medium");
  const volume = cakeVolumeCm3({ shape, diameter, sideA, sideB, height });
  const portionVol = PORTION_SIZES.find((p) => p.key === portionKey).volume;
  const servings = volume > 0 ? Math.max(0, Math.floor(volume / portionVol)) : 0;

  const [scratchServ, setScratchServ] = useState("8");
  const [scratchTarget, setScratchTarget] = useState(8);
  const [scratchIngs, setScratchIngs] = useState([{ id: genId("ing"), amount: "", unit: "g", name: "" }]);
  const updateScratch = (id, patch) => setScratchIngs((prev) => prev.map((i) => (i.id === id ? { ...i, ...patch } : i)));
  const removeScratch = (id) => setScratchIngs((prev) => prev.filter((i) => i.id !== id));
  const addScratch = () => setScratchIngs((prev) => [...prev, { id: genId("ing"), amount: "", unit: "g", name: "" }]);
  const scratchRatio = scratchTarget / (parseAmount(scratchServ) || 1);

  return (
    <div className="flex flex-col h-full">
      <TopBar title="Kalkulator" />
      <div className="px-4 pt-3 flex gap-2">
        <Pill active={tab === "cake"} onClick={() => setTab("cake")}>Porcje tortu</Pill>
        <Pill active={tab === "scratch"} onClick={() => setTab("scratch")} color={T.pistachio}>Przelicznik przepisu</Pill>
      </div>
      <Screen>
        {tab === "cake" ? (
          <>
            <div className="flex gap-2 mb-4">
              <Pill active={shape === "round"} onClick={() => setShape("round")}>Okrągły</Pill>
              <Pill active={shape === "rect"} onClick={() => setShape("rect")}>Prostokątny</Pill>
            </div>
            {shape === "round" ? <TextField label="Średnica formy" value={diameter} onChange={setDiameter} type="number" suffix="cm" /> : (
              <div className="flex gap-3">
                <div className="flex-1"><TextField label="Długość" value={sideA} onChange={setSideA} type="number" suffix="cm" /></div>
                <div className="flex-1"><TextField label="Szerokość" value={sideB} onChange={setSideB} type="number" suffix="cm" /></div>
              </div>
            )}
            <TextField label="Wysokość tortu" value={height} onChange={setHeight} type="number" suffix="cm" />
            <span className="block text-xs mb-1.5 tracking-wide uppercase" style={{ color: T.textFaint, fontFamily: FONT_BODY }}>Wielkość porcji</span>
            <div className="flex gap-2 mb-6 flex-wrap">{PORTION_SIZES.map((p) => <Pill key={p.key} active={portionKey === p.key} onClick={() => setPortionKey(p.key)} color={T.vanilla}>{p.label}</Pill>)}</div>
            <div className="rounded-2xl p-6 text-center" style={{ backgroundColor: T.bgElevated, border: `1px solid ${T.border}` }}>
              <p className="text-xs uppercase tracking-widest mb-2" style={{ color: T.textFaint, fontFamily: FONT_BODY }}>Szacowana liczba porcji</p>
              <p style={{ fontFamily: FONT_MONO, fontSize: 44, fontWeight: 600, color: T.vanilla, lineHeight: 1 }}>{servings}</p>
              <p className="text-xs mt-3" style={{ color: T.textFaint, fontFamily: FONT_BODY }}>Objętość ok. {formatNum(volume / 1000)} l — wartość orientacyjna, zależna od gęstości ciasta.</p>
            </div>
          </>
        ) : (
          <>
            <p className="text-xs mb-4 leading-relaxed" style={{ color: T.textFaint, fontFamily: FONT_BODY }}>Szybkie przeliczenie dowolnego przepisu — bez zapisywania go w bazie.</p>
            <TextField label="Oryginalny przepis: liczba porcji" value={scratchServ} onChange={setScratchServ} type="number" suffix="porcji" />
            <div className="space-y-2 mb-3">
              {scratchIngs.map((ing) => (
                <div key={ing.id} className="flex gap-2">
                  <input value={ing.amount} onChange={(e) => updateScratch(ing.id, { amount: e.target.value })} placeholder="ilość" inputMode="decimal"
                    className="w-16 rounded-lg px-2 py-2.5 outline-none text-center" style={{ backgroundColor: T.bgElevated, border: `1px solid ${T.border}`, color: T.text, fontFamily: FONT_MONO, fontSize: 14 }} />
                  <select value={ing.unit} onChange={(e) => updateScratch(ing.id, { unit: e.target.value })} className="w-24 rounded-lg px-1 py-2.5 outline-none"
                    style={{ backgroundColor: T.bgElevated, border: `1px solid ${T.border}`, color: T.textMuted, fontFamily: FONT_BODY, fontSize: 13 }}>
                    {UNITS.map((u) => <option key={u} value={u}>{u}</option>)}
                  </select>
                  <input value={ing.name} onChange={(e) => updateScratch(ing.id, { name: e.target.value })} placeholder="nazwa składnika"
                    className="flex-1 min-w-0 rounded-lg px-3 py-2.5 outline-none" style={{ backgroundColor: T.bgElevated, border: `1px solid ${T.border}`, color: T.text, fontFamily: FONT_BODY, fontSize: 14 }} />
                  <button onClick={() => removeScratch(ing.id)} className="w-9 shrink-0 rounded-lg flex items-center justify-center" style={{ color: T.textFaint }}><X size={16} /></button>
                </div>
              ))}
            </div>
            <button onClick={addScratch} className="flex items-center gap-1.5 text-sm mb-6" style={{ color: T.vanilla, fontFamily: FONT_BODY, fontWeight: 600 }}><Plus size={15} /> Dodaj składnik</button>
            <div className="rounded-2xl p-5 mb-4" style={{ backgroundColor: T.bgElevated, border: `1px solid ${T.border}` }}>
              <p className="text-center text-xs uppercase tracking-widest mb-1" style={{ color: T.textFaint, fontFamily: FONT_BODY }}>Docelowa liczba porcji</p>
              <ScaleDial value={scratchTarget} min={1} max={Math.max(48, (parseAmount(scratchServ) || 8) * 3)} onChange={setScratchTarget} unitLabel="porcji" />
            </div>
            {scratchIngs.some((i) => i.name.trim()) && (
              <div className="rounded-2xl overflow-hidden" style={{ backgroundColor: T.bgElevated, border: `1px solid ${T.border}` }}>
                {scratchIngs.filter((i) => i.name.trim()).map((ing, i) => (
                  <div key={ing.id} className="flex items-center justify-between px-4 py-3" style={{ borderTop: i === 0 ? "none" : `1px solid ${T.border}` }}>
                    <span style={{ color: T.text, fontFamily: FONT_BODY, fontSize: 15 }}>{ing.name}</span>
                    <span style={{ color: T.vanilla, fontFamily: FONT_MONO, fontSize: 15, fontWeight: 600 }}>{formatNum(parseAmount(ing.amount) * scratchRatio)} {ing.unit}</span>
                  </div>
                ))}
              </div>
            )}
          </>
        )}
      </Screen>
    </div>
  );
}

/* ---------------------------------------------------------------
   INGREDIENTS
----------------------------------------------------------------*/
function IngredientsScreen({ ingredients, onAdd, onRemove }) {
  const [name, setName] = useState("");
  const [density, setDensity] = useState("");
  const [convAmount, setConvAmount] = useState("100");
  const [convFrom, setConvFrom] = useState("g");
  const [activeConv, setActiveConv] = useState(null);
  const submit = () => { if (!name.trim()) return; onAdd({ id: genId("ing"), name: name.trim(), density: density ? parseAmount(density) : null }); setName(""); setDensity(""); };
  const convert = (ing) => { if (!ing.density) return null; const amt = parseAmount(convAmount); return convFrom === "g" ? amt / ing.density : amt * ing.density; };
  return (
    <div className="flex flex-col h-full">
      <TopBar title="Baza składników" />
      <Screen>
        <p className="text-xs mb-4 leading-relaxed" style={{ color: T.textFaint, fontFamily: FONT_BODY }}>Zapisz gęstość składnika (g na ml), by przeliczać między gramami a mililitrami.</p>
        <div className="rounded-2xl p-4 mb-6" style={{ backgroundColor: T.bgElevated, border: `1px solid ${T.border}` }}>
          <div className="flex gap-2">
            <input value={name} onChange={(e) => setName(e.target.value)} placeholder="Nazwa składnika" className="flex-1 rounded-lg px-3 py-2.5 outline-none" style={{ backgroundColor: T.bgElevated2, border: `1px solid ${T.border}`, color: T.text, fontFamily: FONT_BODY, fontSize: 14 }} />
            <input value={density} onChange={(e) => setDensity(e.target.value)} placeholder="g/ml" inputMode="decimal" className="w-20 rounded-lg px-2 py-2.5 outline-none text-center" style={{ backgroundColor: T.bgElevated2, border: `1px solid ${T.border}`, color: T.text, fontFamily: FONT_MONO, fontSize: 14 }} />
          </div>
          <button onClick={submit} className="mt-3 flex items-center gap-1.5 text-sm" style={{ color: T.vanilla, fontFamily: FONT_BODY, fontWeight: 600 }}><Plus size={15} /> Dodaj składnik</button>
        </div>
        {(ingredients || []).length === 0 ? <EmptyState icon={Wheat} title="Brak składników" subtitle="Dodaj składniki z ich gęstością, żeby przeliczać jednostki." /> : (
          <div className="space-y-2.5">
            {ingredients.map((ing) => (
              <div key={ing.id} className="rounded-2xl overflow-hidden" style={{ backgroundColor: T.bgElevated, border: `1px solid ${T.border}` }}>
                <div className="flex items-center justify-between px-4 py-3.5">
                  <div>
                    <p style={{ color: T.text, fontFamily: FONT_BODY, fontSize: 15, fontWeight: 600 }}>{ing.name}</p>
                    <p className="text-xs mt-0.5" style={{ color: T.textFaint, fontFamily: FONT_MONO }}>{ing.density ? `gęstość ${ing.density} g/ml` : "brak danych o gęstości"}</p>
                  </div>
                  <div className="flex items-center gap-1">
                    {ing.density && <button onClick={() => setActiveConv(activeConv === ing.id ? null : ing.id)} className="p-2 rounded-full" style={{ color: activeConv === ing.id ? T.raspberry : T.textFaint }}><Scale size={16} /></button>}
                    <button onClick={() => onRemove(ing.id)} className="p-2 rounded-full" style={{ color: T.textFaint }}><Trash2 size={15} /></button>
                  </div>
                </div>
                {activeConv === ing.id && ing.density && (
                  <div className="px-4 pb-4 flex items-center gap-2" style={{ borderTop: `1px solid ${T.border}` }}>
                    <input value={convAmount} onChange={(e) => setConvAmount(e.target.value)} inputMode="decimal" className="w-20 rounded-lg px-2 py-2 mt-3 outline-none text-center" style={{ backgroundColor: T.bgElevated2, border: `1px solid ${T.border}`, color: T.text, fontFamily: FONT_MONO, fontSize: 14 }} />
                    <select value={convFrom} onChange={(e) => setConvFrom(e.target.value)} className="rounded-lg px-2 py-2 mt-3 outline-none" style={{ backgroundColor: T.bgElevated2, border: `1px solid ${T.border}`, color: T.textMuted, fontFamily: FONT_BODY, fontSize: 13 }}>
                      <option value="g">gramów →</option>
                      <option value="ml">mililitrów →</option>
                    </select>
                    <span className="mt-3 flex-1 text-right" style={{ color: T.vanilla, fontFamily: FONT_MONO, fontSize: 15, fontWeight: 600 }}>{formatNum(convert(ing))} {convFrom === "g" ? "ml" : "g"}</span>
                  </div>
                )}
              </div>
            ))}
          </div>
        )}
      </Screen>
    </div>
  );
}

/* ---------------------------------------------------------------
   SETTINGS (API key for photo recognition)
----------------------------------------------------------------*/
function SettingsScreen({ apiKey, setApiKey }) {
  const [draft, setDraft] = useState(apiKey);
  const [saved, setSaved] = useState(false);
  const save = () => { setApiKey(draft.trim()); setSaved(true); setTimeout(() => setSaved(false), 1800); };
  return (
    <div className="flex flex-col h-full">
      <TopBar title="Ustawienia" />
      <Screen>
        <p className="text-sm mb-5 leading-relaxed" style={{ color: T.textMuted, fontFamily: FONT_BODY }}>
          Rozpoznawanie przepisów ze zdjęć korzysta bezpośrednio z modelu Claude, więc potrzebuje Twojego własnego klucza API Anthropic.
          Klucz zostaje zapisany tylko w tej przeglądarce, na tym urządzeniu — nie jest nigdzie wysyłany poza bezpośrednie wywołania do api.anthropic.com.
        </p>
        <TextField label="Klucz API Anthropic" value={draft} onChange={setDraft} placeholder="sk-ant-..." type="password" />
        <PrimaryButton onClick={save} icon={saved ? undefined : Save} disabled={!draft.trim() && !apiKey}>
          {saved ? "Zapisano ✓" : "Zapisz klucz"}
        </PrimaryButton>
        {apiKey && (
          <button onClick={() => { setDraft(""); setApiKey(""); }} className="w-full text-center text-xs mt-4" style={{ color: T.textFaint, fontFamily: FONT_BODY }}>Usuń zapisany klucz</button>
        )}
        <div className="rounded-xl p-4 mt-6" style={{ backgroundColor: T.bgElevated, border: `1px solid ${T.border}` }}>
          <p className="text-xs leading-relaxed" style={{ color: T.textFaint, fontFamily: FONT_BODY }}>
            Klucz stworzysz na stronie console.anthropic.com (zakładka API Keys). Rozpoznawanie zdjęć to płatne wywołania API — koszt pojedynczego odczytu przepisu to zwykle ułamek centa.
          </p>
        </div>
      </Screen>
    </div>
  );
}

/* ---------------------------------------------------------------
   BOTTOM NAV
----------------------------------------------------------------*/
function BottomNav({ tab, setTab }) {
  const items = [
    { key: "recipes", label: "Przepisy", icon: BookOpen },
    { key: "calculator", label: "Kalkulator", icon: Scale },
    { key: "ingredients", label: "Składniki", icon: Wheat },
    { key: "settings", label: "Ustawienia", icon: Settings },
  ];
  return (
    <div className="absolute bottom-0 left-0 right-0 flex items-center justify-around px-2 pt-2" style={{ backgroundColor: T.bgElevated, borderTop: `1px solid ${T.border}`, paddingBottom: "max(10px, env(safe-area-inset-bottom))" }}>
      {items.map(({ key, label, icon: IconEl }) => {
        const active = tab === key;
        return (
          <button key={key} onClick={() => setTab(key)} className="flex flex-col items-center gap-1 py-1.5 px-3">
            <IconEl size={20} style={{ color: active ? T.raspberry : T.textFaint }} />
            <span className="text-[10px]" style={{ color: active ? T.raspberry : T.textFaint, fontFamily: FONT_BODY, fontWeight: active ? 600 : 500 }}>{label}</span>
          </button>
        );
      })}
    </div>
  );
}

/* ---------------------------------------------------------------
   APP ROOT
----------------------------------------------------------------*/
function App() {
  const [tab, setTab] = useState("recipes");
  const [view, setView] = useState({ screen: "list" });
  const [recipes, setRecipes] = useStoredList("popieczona_recipes", SEED_RECIPES);
  const [ingredients, setIngredients] = useStoredList("popieczona_ingredients", SEED_INGREDIENTS);
  const [apiKey, setApiKey] = useApiKey();

  const openRecipe = (r) => setView({ screen: "detail", recipe: r });
  const openAdd = () => setView({ screen: "add" });
  const backToList = () => setView({ screen: "list" });
  const saveRecipe = (r) => { setRecipes([r, ...(recipes || [])]); setView({ screen: "detail", recipe: r }); };
  const deleteRecipe = (id) => { setRecipes((recipes || []).filter((r) => r.id !== id)); backToList(); };
  const addIngredient = (ing) => setIngredients([ing, ...(ingredients || [])]);
  const removeIngredient = (id) => setIngredients((ingredients || []).filter((i) => i.id !== id));

  useEffect(() => { if (tab !== "recipes") setView({ screen: "list" }); }, [tab]);

  let body;
  if (tab === "recipes") {
    if (view.screen === "detail") body = <RecipeDetail recipe={view.recipe} onBack={backToList} onDelete={deleteRecipe} />;
    else if (view.screen === "add") body = <AddRecipe onBack={backToList} onSave={saveRecipe} apiKey={apiKey} goToSettings={() => setTab("settings")} />;
    else body = <RecipesScreen recipes={recipes} onOpen={openRecipe} onAdd={openAdd} />;
  } else if (tab === "calculator") body = <CalculatorScreen />;
  else if (tab === "ingredients") body = <IngredientsScreen ingredients={ingredients} onAdd={addIngredient} onRemove={removeIngredient} />;
  else body = <SettingsScreen apiKey={apiKey} setApiKey={setApiKey} />;

  const showNav = !(tab === "recipes" && view.screen !== "list");

  return (
    <div className="w-full h-screen flex items-center justify-center" style={{ backgroundColor: "#150E0A" }}>
      <div className="relative w-full max-w-[420px] h-full flex flex-col overflow-hidden" style={{ backgroundColor: T.bg, fontFamily: FONT_BODY }}>
        {body}
        {showNav && <BottomNav tab={tab} setTab={setTab} />}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
